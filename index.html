<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVR8js LED Demo</title>
    <script type="module" crossorigin src="/my-app/assets/main1-n_0lOL0W.js"></script>
    <link rel="stylesheet" crossorigin href="/my-app/assets/main1--ZOX0jVu.css">
  </head>

  <body>
    <h2>AVR8js 6-LED Demo</h2>
    <div class="app-container">
      <div class="leds">
        <wokwi-led color="red" pin="7" label="7"></wokwi-led>
        <wokwi-pushbutton color="red" pin="3" label="3"></wokwi-pushbutton>
        <wokwi-7segment color="red" values="[0,1,1,0,0,1,1,1]" pins="2"></wokwi-7segment>
      </div>
      <div class="toolbar">
        <button id="run-button">Run</button>
        <button id="stop-button" disabled>Stop</button>
        <div class="spacer"></div>
        <div id="status-label"></div>
         <button onclick="window.location.href='que1.html'">que1.htmlを開く</button>
      </div>
      <div class="code-editor"></div>
      <div class="compiler-output">
        <pre id="compiler-output-text"></pre>
      </div>
      <div id ='test-output'>
        <h3 id="test-output-label">Test Output1</h3>
        <pre id="test-output-text"></pre>
    </div>
  </body>
</html>
