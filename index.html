<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@wokwi/elements@1.4.5/dist/wokwi-elements.bundle.js"></script>

    <title>AVR8js LED Demo</title>
    <script type="module" crossorigin src="/my-app/assets/index-SQ0xuAVB.js"></script>
    <link rel="stylesheet" crossorigin href="/my-app/assets/index--ZOX0jVu.css">
  </head>

  <body>
    <h2>AVR8js 6-LED Demo</h2>
    <div class="app-container">
      <div class="leds">
        <wokwi-led color="red" pin="13" label="13"></wokwi-led>
        <wokwi-led color="green" pin="12" label="12"></wokwi-led>
        <wokwi-led color="blue" pin="11" label="11"></wokwi-led>
        <wokwi-led color="yellow" pin="10" label="10"></wokwi-led>
        <wokwi-led color="orange" pin="9" label="9"></wokwi-led>
        <wokwi-led color="white" pin="8" label="8"></wokwi-led>
        <wokwi-pushbutton color="red" pin="14"></wokwi-pushbutton>
      </div>
      <div class="toolbar">
        <button id="run-button">Run</button>
        <button id="stop-button" disabled>Stop</button>
        <div class="spacer"></div>
        <div id="status-label"></div>
      </div>
      <div class="code-editor"></div>
      <div class="compiler-output">
        <pre id="compiler-output-text"></pre>
      </div>
      <div id ='test-output'>
        <h3 id="test-output-label">Test Output</h3>
        <pre id="test-output-text"></pre>
    </div>
  </body>
</html>
