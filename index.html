  <script>
    let selected_editor = '#editor1';
    const readOnly = false;
    window.INITIAL_CODE = `
void setup() {
    pinMode(3, INPUT_PULLUP);              
    pinMode(7, OUTPUT);             
}

void loop() {
    if(digitalRead(3)== LOW){      
      digitalWrite(7,1);            
    }
    else {                          
      digitalWrite(7,0);           
    }
}`.trim();

    document.getElementById('check-pin').addEventListener('click', () => {
      if (window.runner) {
        const portDPin = (runner.portD && typeof runner.portD.PIN !== 'undefined')
          ? runner.portD.PIN.toString(2).padStart(8, '0')
          : '--------';
        const portBPin = (runner.portB && typeof runner.portB.PIN !== 'undefined')
          ? runner.portB.PIN.toString(2).padStart(8, '0')
          : '--------';
        document.getElementById('test-output-text').textContent =
          `PORTD: ${portDPin}\nPORTB: ${portBPin}`;

      } else {
        document.getElementById('test-output-text').textContent =
          'runnerが初期化されていません（Runボタンを押してください）';
      }
    });
  </script>
