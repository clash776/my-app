  <body>
    <h2>第１章　マイコンとは何か</h2>
    <h3>マイコンとは電気機器を制御するための小さなコンピュータです。
    <br>冷蔵庫や洗濯機、エアコンなど、様々な電気機器に使われています。
    </h3>
    <h3>マイコンにはさまざまな種類、機能があります。</h3>
    <div style="display: flex; gap: 40px; align-items: flex-start; margin-bottom: 24px; justify-content: center;">
      <div style="text-align: center;">
        <wokwi-arduino-uno></wokwi-arduino-uno>
        <div style="margin-top: 8px; font-weight: bold;">Arduino Uno</div>
      </div>
      <div style="text-align: center;">
        <wokwi-esp32-devkit-v1></wokwi-esp32-devkit-v1>
        <div style="margin-top: 8px; font-weight: bold;">ESP32 DevKit v1</div>
      </div>
    </div>
    <div class="app-container">
      <div class="leds">
        <!-- <wokwi-led color="red" pin="7" label="7"></wokwi-led>
        <wokwi-pushbutton color="red" pin="3" label="3"></wokwi-pushbutton> -->
      </div>
      <div class="toolbar">
        <button id="run-button">Run</button>
        <button id="stop-button" disabled>Stop</button>

      </div>
      <div class="code-editor"></div>
      <div class="compiler-output">

      </div>
      <div id ='test-output'>
        <h3 id="test-output-label">Test Output1</h3>

        <button id="check-button">正誤チェック</button> 
      </div>
      <div class="nextpages">
        <button id="nextpage-btn" style="display:none;" onclick="window.location.href='que2.html'">que2.htmlを開く</button>
      </div>
    </div>
<script>
window.INITIAL_CODE = `
void setup() {
    pinMode(3, INPUT_PULLUP);              
    pinMode(7, OUTPUT);             
}
void loop() {
    // ここに処理を書く
}
`.trim();
</script>
  <script>
    document.getElementById('check-button').addEventListener('click', () => {
      console.log(lastPortDState);
      console.log(lastPortBState);
      const userCode = editor.getModel().getValue()
      console.log(userCode);
    const testoutputlabel = document.getElementById('test-output-label');
    const nextpageBtn = document.getElementById('nextpage-btn');
    const CORRECT_PART1 = `pinMode(3, INPUT_PULLUP);`;
    const CORRECT_PART2 = `pinMode(7, OUTPUT);`;

    if (userCode.includes(CORRECT_PART1) && userCode.includes(CORRECT_PART2)) {
      testoutputlabel.textContent = "正解です！";
      nextpageBtn.style.display = "inline";
    } else if (userCode.includes(CORRECT_PART1)) {
      testoutputlabel.textContent = "7番ピンの設定が正しくありません。";
      nextpageBtn.style.display = "none";
    } else if (userCode.includes(CORRECT_PART2)) {
      testoutputlabel.textContent = "3番ピンの設定が正しくありません。";
      nextpageBtn.style.display = "none";
    } else {
      testoutputlabel.textContent = "もう一度やってみよう";
      nextpageBtn.style.display = "none";
    }
    });
  </script>
  </body>
